<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookstore Assistant</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Bookstore Assistant navigation">
        <div class="brand">
          <div class="brand-mark">B</div>
          <div>
            <h1>Bookstore Assistant</h1>
            <p>Local assistant console</p>
          </div>
        </div>

        <button id="new-chat" class="new-chat-button" type="button">New chat</button>

        <section class="nav-section" aria-labelledby="history-heading">
          <div class="panel-heading">
            <h2 id="history-heading">Chats</h2>
          </div>
          <div id="chat-list" class="chat-list"></div>
        </section>

        <section class="nav-section" aria-labelledby="agents-heading">
          <div class="panel-heading">
            <h2 id="agents-heading">Agents</h2>
          </div>
          <div id="agent-list" class="agent-list"></div>
        </section>

        <section class="approvals">
          <div class="panel-heading">
            <h2>Approvals</h2>
            <button id="refresh-approvals" class="icon-button" type="button" title="Refresh approvals" aria-label="Refresh approvals">Refresh</button>
          </div>
          <div id="approval-list" class="approval-list"></div>
        </section>
      </aside>

      <section class="conversation" aria-label="Conversation">
        <div id="messages" class="messages">
          <section id="landing" class="landing" aria-live="polite">
            <p id="landing-agent" class="landing-agent"></p>
            <h2>Bookstore Assistant</h2>
          </section>
        </div>
        <div class="composer-wrap">
          <section class="recommendations" aria-label="Recommended prompts">
            <button id="recommendation-prev" class="carousel-control" type="button" aria-label="Previous recommendations">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <div id="recommendation-track" class="recommendation-track"></div>
            <button id="recommendation-next" class="carousel-control" type="button" aria-label="Next recommendations">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </section>
          <form id="chat-form" class="composer">
            <textarea id="message-input" rows="2" placeholder="Message Bookstore Assistant"></textarea>
            <button id="send-button" class="send-button" type="submit" aria-label="Send message" title="Send message" disabled>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m22 2-7 20-4-9-9-4Z" />
                <path d="M22 2 11 13" />
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
