[project]
name = "bookstore-agents"
version = "0.1.0"
description = "Local Bookstore Assistant with FastMCP servers, A2A-style agents, OpenAI and Ollama runtimes, ChatKit-oriented frontend, and PostgreSQL demo data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[fastapi]",
    "fastapi>=0.115.0",
    "fastmcp>=3.2.4",
    "httpx>=0.27.0",
    "openai>=2.0.0",
    "openai-agents>=0.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-httpx>=0.63b0",
    "opentelemetry-sdk>=1.42.0",
    "openai-chatkit>=0.1.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
bookstore-init-db = "scripts.init_db:main"
bookstore-seed-data = "scripts.seed_fake_data:main"
bookstore-reset-data = "scripts.reset_demo_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookstore_agents", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
