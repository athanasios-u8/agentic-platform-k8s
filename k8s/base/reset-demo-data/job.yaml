---
apiVersion: batch/v1
kind: Job
metadata:
  name: bookstore-reset-demo-data
  labels:
    app.kubernetes.io/name: bookstore-reset-demo-data
    app.kubernetes.io/part-of: bookstore-agents
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-reset-demo-data
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - "-c"
        - until pg_isready -h postgres -p 5432 -U bookstore -d bookstore; do sleep
          2; done
      containers:
      - name: reset-demo-data
        image: bookstore/backend:local
        imagePullPolicy: IfNotPresent
        args:
        - python
        - "-m"
        - scripts.reset_demo_data
        envFrom:
        - configMapRef:
            name: bookstore-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: DATABASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: OPENAI_API_KEY
