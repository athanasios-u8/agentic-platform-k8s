---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upcoming-releases-mcp
  labels:
    app.kubernetes.io/name: upcoming-releases-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: bookstore-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upcoming-releases-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upcoming-releases-mcp
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      enableServiceLinks: false
      containers:
      - name: upcoming-releases-mcp
        image: bookstore/upcoming-releases-mcp:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: bookstore-config
        env:
        - name: BOOKSTORE_SERVICE_MODULE
          value: bookstore_agents.mcp_servers.upcoming_releases.server
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: TAVILY_API_KEY
        ports:
        - name: http
          containerPort: 8104
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
