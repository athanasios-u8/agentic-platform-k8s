---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-summarizer-agent
  labels:
    app.kubernetes.io/name: review-summarizer-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: bookstore-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review-summarizer-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-summarizer-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      enableServiceLinks: false
      containers:
      - name: review-summarizer-agent
        image: bookstore/review-summarizer-agent:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: bookstore-config
        env:
        - name: BOOKSTORE_SERVICE_MODULE
          value: bookstore_agents.agents.review_summarizer.server
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: DATABASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: OPENAI_API_KEY
        - name: AZURE_AI_SEARCH_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: AZURE_AI_SEARCH_ENDPOINT
        - name: AZURE_AI_SEARCH_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: AZURE_AI_SEARCH_ADMIN_KEY
        - name: AZURE_AI_SEARCH_QUERY_KEY
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: AZURE_AI_SEARCH_QUERY_KEY
        ports:
        - name: http
          containerPort: 8207
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
