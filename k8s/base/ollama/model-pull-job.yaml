---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-llama3-2-3b
  labels:
    app.kubernetes.io/name: ollama-pull-llama3-2-3b
    app.kubernetes.io/component: model-runtime
    app.kubernetes.io/part-of: bookstore-agents
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull-llama3-2-3b
        app.kubernetes.io/component: model-runtime
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      restartPolicy: OnFailure
      containers:
      - name: ollama-pull
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          value: http://ollama:11434
        - name: OLLAMA_MODEL
          valueFrom:
            configMapKeyRef:
              name: bookstore-config
              key: OLLAMA_MODEL
        command:
        - sh
        - -c
        args:
        - |
          until ollama list; do
            sleep 2
          done
          ollama pull "${OLLAMA_MODEL}"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
