---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: bookstore-agents
  name: frontend
  namespace: nucleus
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: bookstore-agents
  name: frontend
  namespace: nucleus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      containers:
      - env:
        - name: FRONTEND_GATEWAY_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              key: FRONTEND_GATEWAY_PUBLIC_URL
              name: bookstore-config
        - name: CHATKIT_API_PATH
          valueFrom:
            configMapKeyRef:
              key: CHATKIT_API_PATH
              name: bookstore-config
        image: acrnucleusdevswec001.azurecr.io/bookstore/frontend:dev
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: "/"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        name: frontend
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: "/"
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
