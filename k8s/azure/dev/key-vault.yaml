---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: azure-secrets-bootstrap
    app.kubernetes.io/part-of: bookstore-agents
  name: azure-secrets-bootstrap
  namespace: nucleus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azure-secrets-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/component: secrets
        app.kubernetes.io/name: azure-secrets-bootstrap
        app.kubernetes.io/part-of: bookstore-agents
        azure.workload.identity/use: 'true'
    spec:
      containers:
      - command:
        - sh
        - "-c"
        - while true; do sleep 3600; done
        image: acrnucleusdevswec001.azurecr.io/bookstore/busybox:1.36.1
        imagePullPolicy: IfNotPresent
        name: secrets-store
        resources:
          limits:
            cpu: 25m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: "/mnt/secrets-store"
          name: secrets-store
          readOnly: true
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nucleus-runtime
      volumes:
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: azure-key-vault
        name: secrets-store
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  labels:
    app.kubernetes.io/component: secrets
    app.kubernetes.io/name: azure-key-vault
    app.kubernetes.io/part-of: bookstore-agents
  name: azure-key-vault
  namespace: nucleus
spec:
  parameters:
    clientID: 890700b0-298a-4de7-88b8-20b83eb80ba5
    keyvaultName: kv-nucleus-dev-swec-001
    objects: |
      array:
        - |
          objectName: sec-nucleus-dev-swec-001
          objectAlias: postgres-admin-password
          objectType: secret
          objectVersion: ""
    tenantId: 7a51efba-4cd4-4200-aea4-df68900aeac1
    usePodIdentity: 'false'
  provider: azure
  secretObjects:
  - data:
    - key: POSTGRES_PASSWORD
      objectName: postgres-admin-password
    secretName: azure-database-credentials
    type: Opaque
