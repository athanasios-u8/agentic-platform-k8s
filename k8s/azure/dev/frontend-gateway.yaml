---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: frontend-gateway
    app.kubernetes.io/part-of: bookstore-agents
  name: frontend-gateway
  namespace: nucleus
spec:
  ports:
  - name: http
    port: 8300
    targetPort: http
  selector:
    app.kubernetes.io/name: frontend-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: frontend-gateway
    app.kubernetes.io/part-of: bookstore-agents
  name: frontend-gateway
  namespace: nucleus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/name: frontend-gateway
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      containers:
      - env:
        - name: BOOKSTORE_SERVICE_MODULE
          value: bookstore_agents.frontend_gateway.server
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: azure-database-credentials
        - name: DATABASE_URL
          value: host=psql-nucleus-dev-swec-001.postgres.database.azure.com port=5432
            dbname=bookstore user=nucleusadmin password=$(POSTGRES_PASSWORD) sslmode=require
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: bookstore-secrets
              optional: true
        envFrom:
        - configMapRef:
            name: bookstore-config
        image: acrnucleusdevswec001.azurecr.io/bookstore/frontend-gateway:dev
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
        name: frontend-gateway
        ports:
        - containerPort: 8300
          name: http
        readinessProbe:
          httpGet:
            path: "/readyz"
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
      enableServiceLinks: false
