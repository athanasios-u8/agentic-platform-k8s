---
apiVersion: kaos.tools/v1alpha1
kind: Agent
metadata:
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: store-manager-agent
    app.kubernetes.io/part-of: bookstore-agents
  name: store-manager
  namespace: nucleus
spec:
  agentNetwork:
    access:
    - catalog-specialist
    - reservation-specialist
    - message-drafter
    expose: true
  config:
    description: Staff-facing master agent for daily operations, sales, stock, and
      pickups.
    instructions: |
      You are the Store Manager agent. Help staff understand sales, pickup workload,
      low stock, and opening or closing priorities. Keep the answer concise and operational.
    reasoningLoopMaxSteps: 5
  container:
    env:
    - name: BOOKSTORE_SERVICE_MODULE
      value: bookstore_agents.agents.store_manager.server
    - name: STORE_MANAGER_AGENT_PORT
      value: '8000'
    - name: OPENAI_MODEL
      value: gpt-5-mini
    - name: CATALOG_MCP_URL
      value: http://mcpserver-catalog:8000/mcp
    - name: STORE_OPERATIONS_MCP_URL
      value: http://mcpserver-store-operations:8000/mcp
    - name: CATALOG_SPECIALIST_AGENT_URL
      value: http://agent-catalog-specialist:8000
    - name: RESERVATION_SPECIALIST_AGENT_URL
      value: http://agent-reservation-specialist:8000
    - name: MESSAGE_DRAFTER_AGENT_URL
      value: http://agent-message-drafter:8000
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          key: POSTGRES_PASSWORD
          name: azure-database-credentials
    - name: DATABASE_URL
      value: host=psql-nucleus-dev-swec-001.postgres.database.azure.com port=5432
        dbname=bookstore user=nucleusadmin password=$(POSTGRES_PASSWORD) sslmode=require
    image: acrnucleusdevswec001.azurecr.io/bookstore/store-manager-agent:dev
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
  mcpServers:
  - catalog
  - store-operations
  model: gpt-5-mini
  modelAPI: openai
  podSpec:
    containers:
    - env:
      - name: AZURE_CLIENT_ID
        value: 890700b0-298a-4de7-88b8-20b83eb80ba5
      - name: AZURE_TENANT_ID
        value: 7a51efba-4cd4-4200-aea4-df68900aeac1
      - name: AZURE_FEDERATED_TOKEN_FILE
        value: "/var/run/secrets/azure/tokens/azure-identity-token"
      - name: AZURE_AUTHORITY_HOST
        value: https://login.microsoftonline.com/
      envFrom:
      - configMapRef:
          name: bookstore-config
      livenessProbe:
        httpGet:
          path: "/healthz"
          port: 8000
        initialDelaySeconds: 20
        periodSeconds: 20
        timeoutSeconds: 3
      name: agent
      imagePullPolicy: Always
      readinessProbe:
        httpGet:
          path: "/readyz"
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
      volumeMounts:
      - mountPath: "/var/run/secrets/azure/tokens"
        name: azure-identity-token
        readOnly: true
    enableServiceLinks: false
    serviceAccountName: nucleus-runtime
    volumes:
    - name: azure-identity-token
      projected:
        defaultMode: 420
        sources:
        - serviceAccountToken:
            audience: api://AzureADTokenExchange
            expirationSeconds: 3600
            path: azure-identity-token
