apiVersion: v1
kind: Secret
metadata:
  name: langfuse-runtime-secrets
  namespace: monitoring
type: Opaque
stringData:
  # This example is intentionally excluded from kustomization.yaml.
  # Prefer deploy.sh, which reuses an existing Secret or generates these values.
  postgres-password: replace-me
  salt: replace-me
  encryption-key: replace-me-with-64-hex-characters
  nextauth-secret: replace-me
  clickhouse-password: replace-me
  redis-password: replace-me
  init-project-public-key: pk-lf-replace-me
  init-project-secret-key: sk-lf-replace-me
  init-user-password: replace-me
  langfuse-auth-string: replace-me-with-base64-basic-auth
