langfuse:
  salt:
    value: "replace-me-with-openssl-rand-base64-32"
  nextauth:
    secret:
      value: "replace-me-with-openssl-rand-base64-32"
  web:
    service:
      type: ClusterIP
      port: 3000
    pod:
      additionalEnv:
        - name: LANGFUSE_INIT_ORG_ID
          value: "bookstore-demo-org"
        - name: LANGFUSE_INIT_ORG_NAME
          value: "Bookstore Demo"
        - name: LANGFUSE_INIT_PROJECT_ID
          value: "bookstore-agents-demo"
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "Bookstore Agents"
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          value: "lf_pk_bookstore_demo"
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          value: "lf_sk_bookstore_demo"
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "demo@bookstore.local"
        - name: LANGFUSE_INIT_USER_NAME
          value: "Bookstore Demo"
        - name: LANGFUSE_INIT_USER_PASSWORD
          value: "bookstore-demo"
  worker:
    replicas: 1
  extraInitContainers:
    - name: wait-for-clickhouse
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          until wget -q -O /dev/null http://langfuse-clickhouse:8123/ping; do
            echo "waiting for ClickHouse..."
            sleep 2
          done

postgresql:
  auth:
    username: langfuse
    database: langfuse
    password: "replace-me-with-openssl-rand-base64-32"

clickhouse:
  host: langfuse-clickhouse
  httpPort: 8123
  nativePort: 9000
  database: default
  auth:
    username: default
    password: "replace-me-with-openssl-rand-base64-32"
  migration:
    url: clickhouse://langfuse-clickhouse:9000
  clusterEnabled: true
  replicaCount: 3
  resourcesPreset: medium
  zookeeper:
    replicaCount: 3
    resourcesPreset: small

redis:
  auth:
    password: "replace-me-with-openssl-rand-base64-32"

s3:
  auth:
    rootUser: langfuse
    rootPassword: "replace-me-with-openssl-rand-base64-32"
