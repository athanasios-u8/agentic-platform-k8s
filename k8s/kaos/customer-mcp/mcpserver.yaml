---
apiVersion: kaos.tools/v1alpha1
kind: MCPServer
metadata:
  name: customer
  namespace: bookstore
  labels:
    app.kubernetes.io/name: customer-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: bookstore-agents
spec:
  runtime: custom
  gatewayRoute:
    timeout: "60s"
  container:
    image: bookstore/customer-mcp:local
    env:
      - name: BOOKSTORE_SERVICE_MODULE
        value: bookstore_agents.mcp_servers.customer.server
      - name: CUSTOMER_MCP_PORT
        value: "8000"
      - name: LOG_LEVEL
        valueFrom:
          configMapKeyRef:
            name: bookstore-config
            key: LOG_LEVEL
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: bookstore-secrets
            key: DATABASE_URL
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
