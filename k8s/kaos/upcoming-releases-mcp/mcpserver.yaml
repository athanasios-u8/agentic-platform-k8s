---
apiVersion: kaos.tools/v1alpha1
kind: MCPServer
metadata:
  name: upcoming-releases
  namespace: bookstore
  labels:
    app.kubernetes.io/name: upcoming-releases-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: bookstore-agents
spec:
  runtime: custom
  gatewayRoute:
    timeout: "120s"
  container:
    image: bookstore/upcoming-releases-mcp:local
    env:
      - name: BOOKSTORE_SERVICE_MODULE
        value: bookstore_agents.mcp_servers.upcoming_releases.server
      - name: UPCOMING_RELEASES_MCP_PORT
        value: "8000"
      - name: TAVILY_SEARCH_URL
        valueFrom:
          configMapKeyRef:
            name: bookstore-config
            key: TAVILY_SEARCH_URL
      - name: TAVILY_API_KEY
        valueFrom:
          secretKeyRef:
            name: bookstore-secrets
            key: TAVILY_API_KEY
      - name: LOG_LEVEL
        valueFrom:
          configMapKeyRef:
            name: bookstore-config
            key: LOG_LEVEL
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  podSpec:
    enableServiceLinks: false
    containers:
      - name: mcp-server
