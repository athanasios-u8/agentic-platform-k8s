---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bookstore
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: bookstore-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: bookstore-agents
    spec:
      containers:
        - name: frontend
          image: bookstore/frontend:local
          imagePullPolicy: IfNotPresent
          env:
            - name: FRONTEND_GATEWAY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: bookstore-config
                  key: FRONTEND_GATEWAY_PUBLIC_URL
            - name: CHATKIT_API_PATH
              valueFrom:
                configMapKeyRef:
                  name: bookstore-config
                  key: CHATKIT_API_PATH
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
